過ごし方が原因ではありません。お母さんにも、お父 さんにも責任はありません。 △ 答えずに治療の話へ移る：次の場面で同じ問いが重なる NHS. Turner syndrome: Causes、MedlinePlus Genetics. Turner syndrome 30"}, {"n": 31, "alt": "解説 場面5 背は伸びるか 「背は伸びるんでしょうか」 ◎ 成長を助ける治療があります。効果には個人差がありま すが、今から始める意味はあります。検査を確認して、負担 も含めて一緒に相談しましょう。 △ 期間と費用を断定し一度に話す：情報が多すぎる、不正確な断定 ターナー症候群診療の手引き p.6、CQ2 p.9、移行期医療ガイド p.2 31"}, {"n": 32, "alt": "解説 場面6 赤ちゃんは 「将来、赤ちゃんは産めますか」 ◎ めっけちゃんの場合、自然に妊娠することは難しいと考 えられます。急に将来の話まで出て、驚かれますよね。思春 期の体の変化のほうは、ホルモンの治療で支えられます。 △ 答えずに次回に回す：問いに応えていない 手引き CQ7 p.20、CQ8 p.22、DSD診療ガイドライン 2025年版 CQ11 p.49、CQ28 p.107 32"}, {"n": 33, "alt": "解説 場面7 夫と本人 「夫と本人にどう伝えたら」 ◎ ご希望があれば、次回ご主人にも一緒に聞いていただけ ます。難しければお母さんと続けましょう。めっけちゃんに は、年齢に合わせて少しずつ、一緒に伝えていきましょう。 △ 本人への説明を先延ばし／夫への説明を母親に任せる DSD診療ガイドライン 2025年版 CQ3 p.14、CQ11 p.49、CQ20 p.82-83 33"}, {"n": 34, "alt": "解説 訂正が必要とした3種類の返答 ✕ 合併症の評価前の保証：「ほかは健康ですから大丈夫」 ✕ 治療効果の保証：「ちゃんと伸びる」 ✕ 妊娠の断定と確約：「産めません」「凍結しておけば産める」 共通する点：確かめていないことの言い切り 移行期医療ガイド、ターナー症候群診療の手引き CQ2・CQ7・CQ8、性分化疾患の診療ガイドライン2025 CQ28 34"}, {"n": 35, "alt": "解説 根拠にした資料 直接の根拠：手引き、移行期医療ガイド 場面3・5・6 説明原則の準用：DSD-GL 場面1・2・3・6・7 公的機関の解説：NHS、MedlinePlus 場面4・5 書誌とURLの一覧 github.com/shoei05/rp-6b9e3924 の SOURCES.md 35", "l": [["書誌とURLの一覧（SOURCES.md）", "https://github.com/shoei05/rp-6b9e3924/blob/main/SOURCES.md"]]}, {"n": 36, "alt": "AIの限界 肯定と迎合 肯定 迎合（sycophancy） 相手の体験や感情を否定しない 相手の満足を優先して合わせる 治療的共感 AIの迎合 目的 自立と回復 満足度と対話の継続 沈黙 内省の時間 即座に空白を埋める 現実との検討 穏やかに直面化 無批判に同意 36"}, {"n": 37, "alt": "AIの限界 AIが肯定する頻度 +49% AI 11モデルが人より多く肯定 Cheng M, et al. Science. 2026;391:eaec8352. 2,405人の実験：1回の対話で確信が上昇、修復 の意欲が低下、それでも信頼された 37", "v": [0.055, 0.191, 0.89, 0.722]}, {"n": 38, "alt": "AIの限界 質問の仕方 避ける 「この方針でよいですよね」 勧める 中立に質問し、反対の立場の意見も 求める 38"}, {"n": 39, "alt": "AIの限界 AIの限界と対処 ハルシネーション 引用元を開いて確認 自動化バイアス 自分で考える → AIに問う → 比べる デスキリング AIなしで習得 → AIを利用 → 実技で評価 39"}, {"n": 40, "alt": "セミナー後 セミナー後の使い方 同じURLから何度でも。別の返答で振り返りを比較 GitHubのURLを生成AIに貼り、学ぶ点を質問 研修医・レジデントのトレーニング 40", "l": [["ロールプレイ", "https://shoei05.github.io/rp-6b9e3924/"], ["GitHub", "https://github.com/shoei05/rp-6b9e3924"]]}, {"n"
